<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lucky Draw • Spin & Win</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#fff7e6,#ffe0b2);min-height:100vh;display:flex;justify-content:center;align-items:center;color:#3b2414}
.card{width:min(94vw,520px);background:#fff;border-radius:28px;padding:28px 22px 30px;text-align:center;box-shadow:0 18px 50px #0002}
h1{margin:4px 0 6px;font-size:32px}.sub{margin:0 0 18px;color:#76583f}
.wheel-wrap{position:relative;width:min(82vw,370px);height:min(82vw,370px);margin:8px auto 20px}
canvas{width:100%;height:100%;border-radius:50%;box-shadow:0 8px 25px #0003}
.pointer{position:absolute;top:-3px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:38px solid #e53935;filter:drop-shadow(0 3px 2px #0003);z-index:2}
button{border:0;border-radius:999px;background:#e65100;color:white;font-size:20px;font-weight:700;padding:15px 34px;cursor:pointer;box-shadow:0 8px 18px #e6510040}
button:disabled{opacity:.6;cursor:not-allowed}
.result{min-height:58px;margin-top:18px;padding:14px;border-radius:15px;background:#fff4df;font-size:18px;font-weight:700}
.note{font-size:12px;color:#876f5a;margin-top:14px;line-height:1.45}
</style>
</head>
<body>
<div class="card">
<h1>🎉 SPIN & WIN 🎉</h1>
<p class="sub">Spin the wheel for your lucky discount coupon!</p>
<div class="wheel-wrap">
<div class="pointer"></div>
<canvas id="wheel" width="700" height="700"></canvas>
</div>
<button id="spin">SPIN NOW</button>
<div id="result" class="result">Your coupon will appear here.</div>
<div class="note">Prize probabilities: 10% coupon 40% • 20% coupon 35% • 30% coupon 15% • 40% coupon 10%.</div>
</div>
<script>
const prizes=[
  {label:"10% OFF", weight:40},
  {label:"20% OFF", weight:35},
  {label:"30% OFF", weight:15},
  {label:"40% OFF", weight:10}
];
const canvas=document.getElementById("wheel"),ctx=canvas.getContext("2d");
const cx=350,cy=350,r=340;
const colors=["#ffcc80","#ffab91","#ce93d8","#90caf9"];
const n=prizes.length, arc=2*Math.PI/n;
let rotation=0,busy=false;

function draw(){
  ctx.clearRect(0,0,700,700);
  for(let i=0;i<n;i++){
    const a=rotation+i*arc;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,a,a+arc);ctx.closePath();
    ctx.fillStyle=colors[i];ctx.fill();ctx.strokeStyle="#fff";ctx.lineWidth=8;ctx.stroke();
    ctx.save();ctx.translate(cx,cy);ctx.rotate(a+arc/2);
    ctx.textAlign="right";ctx.fillStyle="#3b2414";ctx.font="bold 42px Arial";
    ctx.fillText(prizes[i].label,r-28,14);ctx.restore();
  }
  ctx.beginPath();ctx.arc(cx,cy,58,0,2*Math.PI);ctx.fillStyle="#fff";ctx.fill();
  ctx.strokeStyle="#e65100";ctx.lineWidth=10;ctx.stroke();
  ctx.fillStyle="#e65100";ctx.font="bold 25px Arial";ctx.textAlign="center";ctx.fillText("LUCKY",cx,8+cy-2);
}
function pick(){
  const total=prizes.reduce((s,p)=>s+p.weight,0);
  let x=Math.random()*total;
  for(let i=0;i<n;i++){x-=prizes[i].weight;if(x<0)return i}
  return n-1;
}
function norm(a){return ((a%(2*Math.PI))+2*Math.PI)%(2*Math.PI)}
function spin(){
 if(busy)return;busy=true;document.getElementById("spin").disabled=true;
 const winner=pick();
 // Position the winning segment under the top pointer.
 const targetCenter=winner*arc+arc/2;
 const desired=norm(-Math.PI/2-targetCenter);
 const current=norm(rotation);
 let delta=desired-current;if(delta<0)delta+=2*Math.PI;
 const extra=(5+Math.floor(Math.random()*3))*2*Math.PI;
 const start=rotation, end=rotation+extra+delta, duration=4300, t0=performance.now();
 function animate(t){
   const p=Math.min(1,(t-t0)/duration), eased=1-Math.pow(1-p,4);
   rotation=start+(end-start)*eased;draw();
   if(p<1)requestAnimationFrame(animate);else{
     document.getElementById("result").innerHTML="🏆 You won <strong>"+prizes[winner].label+"</strong>!<br><span style='font-size:14px;font-weight:400'>Show this screen to redeem your coupon.</span>";
     busy=false;document.getElementById("spin").disabled=false;
   }
 }
 requestAnimationFrame(animate);
}
document.getElementById("spin").addEventListener("click",spin);
draw();
</script>
</body>
</html>
